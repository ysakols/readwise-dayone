name: Readwise → Day One

on:
  schedule:
    - cron:  '0 7 * * *'     # 00:00 PDT (07:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests

      # Use the new ultimate version with enhanced features
      - run: python sync_readwise_ultimate.py
        env:
          # Required credentials
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          DAYONE_EMAIL:   ${{ secrets.DAYONE_EMAIL }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          SMTP_FROM:      ${{ secrets.SMTP_FROM }}

          # Entry creation mode (customize as needed)
          CREATE_INDIVIDUAL_ENTRIES: true   # Individual detailed entries
          CREATE_DAILY_SUMMARY: false       # Set to true for daily rollup too

          # Filtering settings (customize as needed)
          READING_PROGRESS_THRESHOLD: 0.95  # 95% read threshold
          DAYS_BACK: 1                      # Check last day 