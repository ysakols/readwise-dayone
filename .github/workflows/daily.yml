name: Sync Readwise → Day One

# Note: GitHub auto-disables scheduled workflows after 60 days of repo
# inactivity. The keepalive step below re-enables this workflow via the API
# on every run, which resets that 60-day inactivity timer.

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at midnight PT (7:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # required by the keepalive step to re-enable this workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          DAYONE_EMAIL: ${{ secrets.DAYONE_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
      - name: Keepalive (reset 60-day auto-disable timer)
        if: always()
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
