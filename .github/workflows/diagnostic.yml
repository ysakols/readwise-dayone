name: Readwise API Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run Readwise Diagnostic Script
        run: python readwise_diagnostic.py
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }} 