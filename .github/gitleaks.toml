# gitleaks config for .github/workflows/gitleaks.yml, copied from
# ysakols/claude-workflow (security/gitleaks/).
#
# Two parts:
#   1. gitleaks' full maintained default ruleset (useDefault = true), as in
#      claude-workflow's gitleaks-ci.toml.
#   2. The seven `pii-` rules (personal email, SSN, US phone, Visa/MasterCard/
#      Amex card numbers, salary), copied verbatim from claude-workflow's
#      gitleaks.toml, where a test pins them to the local hook's patterns.
#
# Note: gitleaks honours inline `gitleaks:allow` comments for every rule,
# including the PII ones. The local hook does not let that comment wave
# through PII; this CI check does.
#
# The only path allowlisted is this file, whose regexes describe secrets
# and PII. Do not widen the allowlist to hide findings in history: rotate a
# real secret, and add a single confirmed false positive's fingerprint to
# .gitleaksignore instead.

title = "secret + PII scan (from ysakols/claude-workflow)"

[extend]
useDefault = true

[allowlist]
description = "This config file's own rule regexes"
paths = [
    '''(^|/)\.github/gitleaks\.toml$''',
]

# ---- PII rules (copied verbatim from claude-workflow gitleaks.toml) --------

[[rules]]
id = "pii-personal-email"
description = "Personal email (firstname.lastname@)"
regex = '''[a-zA-Z]+\.[a-zA-Z]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}'''

  # RE2 has no lookaround, so the local hook's noreply lookahead becomes a
  # broad match plus this allowlist. regexTarget = "match" tests the whole
  # matched address. It is close to, not identical to, the lookahead; see
  # "Known divergence" in claude-workflow security/gitleaks/README.md.
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''@users\.noreply\.github\.com$''']


[[rules]]
id = "pii-ssn"
description = "Social Security Number"
regex = '''\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b'''


[[rules]]
id = "pii-us-phone"
description = "US phone number"
regex = '''\b(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b'''


[[rules]]
id = "pii-credit-card-visa"
description = "Credit card number (Visa pattern)"
regex = '''\b4\d{3}(?:[-\s]?\d{4}){3}\b'''


[[rules]]
id = "pii-credit-card-mastercard"
description = "Credit card number (MasterCard pattern)"
regex = '''\b5[1-5]\d{2}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b'''


[[rules]]
id = "pii-credit-card-amex"
description = "Credit card number (Amex pattern)"
regex = '''\b3[47]\d{2}[-\s]?\d{6}[-\s]?\d{5}\b'''


[[rules]]
id = "pii-salary"
description = "Salary/compensation figure"
regex = '''(?i)\b(?:salary|salaries|compensation|base pay|base salary|total comp(?:ensation)?|annual pay|OTE)\b[^\d\n]{0,24}\$?\d{1,3}(?:,\d{3})+'''

